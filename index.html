// --- timer state ---
let pomoState = null;
let pomoTimer = null;
let pomoFeedFlash = 0;

function pomoPhaseSeconds(phase) {
  const s = app.pomodoro.settings;
  if (phase === 'work') return Math.max(1, s.work)*60;
  if (phase === 'shortBreak') return Math.max(1, s.shortBreak)*60;
  return Math.max(1, s.longBreak)*60;
}
function fmtPomoTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}
function pomoSnapshot() {
  return pomoState ? {phase:pomoState.phase, running:pomoState.running, remaining:pomoState.remaining, total:pomoState.total, endTime:pomoState.endTime||null, workDone:pomoState.workDone||0, project:pomoState.project||''} : null;
}
function beginPomoInterval() { stopPomoInterval(); pomoTimer = setInterval(pomoTick, 250); }
function stopPomoInterval() { if (pomoTimer) { clearInterval(pomoTimer); pomoTimer = null; } }

function selectPomoPhase(phase) {
  stopPomoInterval();
  PomoAudio.stop();
  const total = pomoPhaseSeconds(phase);
  pomoState = { phase, running:false, remaining:total, total, endTime:null, workDone: pomoState?pomoState.workDone:0, project: phase==='work' ? (app.pomodoro.currentProject||'') : (pomoState?pomoState.project||'' : '') };
  app.pomodoro.active = null;
  persist();
  renderPomodoro();
}

function togglePomodoro() {
  if (!pomoState) { pomoState = { phase:'work', running:false, remaining:pomoPhaseSeconds('work'), total:pomoPhaseSeconds('work'), endTime:null, workDone:0, project: app.pomodoro.currentProject||'' }; }
  if (pomoState.running) { pausePomodoro(); }
  else { startOrResumePomodoro(); }
}

function startOrResumePomodoro() {
  PomoAudio._ensure();
  pomoState.running = true;
  pomoState.endTime = Date.now() + pomoState.remaining*1000;
  app.pomodoro.active = pomoSnapshot();
  persist();
  PomoAudio.play(pomoState.phase === 'work' ? 'work' : 'rest');
  beginPomoInterval();
  renderPomodoro();
}

function pausePomodoro() {
  if (!pomoState || !pomoState.running) return;
  pomoState.remaining = Math.max(0, (pomoState.endTime - Date.now())/1000);
  pomoState.running = false;
  pomoState.endTime = null;
  stopPomoInterval();
  PomoAudio.stop();
  app.pomodoro.active = pomoSnapshot();
  persist();
  renderPomodoro();
}

function resetPomodoro() {
  stopPomoInterval();
  PomoAudio.stop();
  const phase = pomoState ? pomoState.phase : 'work';
  const total = pomoPhaseSeconds(phase);
  pomoState = { phase, running:false, remaining:total, total, endTime:null, workDone:0, project: phase==='work' ? (app.pomodoro.currentProject||'') : '' };
  app.pomodoro.active = null;
  persist();
  renderPomodoro();
}

function pomoTick() {
  if (!pomoState || !pomoState.running) return;
  const rem = (pomoState.endTime - Date.now())/1000;
  if (rem <= 0) { pomoState.remaining = 0; completePomoPhase(); return; }
  pomoState.remaining = rem;
  updatePomoDisplay();
}

function updatePomoDisplay() {
  if (!pomoState) return;
  const el = document.getElementById('pomoTime');
  if (el) el.textContent = fmtPomoTime(Math.max(0, Math.ceil(pomoState.remaining)));
  const pct = document.getElementById('pomoPct');
  if (pct && pomoState.total) pct.textContent = Math.round(Math.max(0,pomoState.remaining)/pomoState.total*100) + '%';
  const ring = document.getElementById('pomoRingFg');
  if (ring && pomoState.total) {
    const C = 2*Math.PI*72;
    const frac = Math.max(0, pomoState.remaining)/pomoState.total;
    ring.setAttribute('stroke-dasharray', C);
    ring.setAttribute('stroke-dashoffset', (C - frac*C).toFixed(2));
  }
}

function completePomoPhase() {
  const finished = pomoState.phase;
  stopPomoInterval();
  PomoAudio.stop();
  PomoAudio.chime(finished === 'work' ? 'work' : 'rest');
  let next;
  if (finished === 'work') {
    recordPomodoro();
    pomoState.workDone = (pomoState.workDone||0) + 1;
    next = (pomoState.workDone % app.pomodoro.settings.longBreakEvery === 0) ? 'longBreak' : 'shortBreak';
  } else {
    next = 'work';
  }
  pomoState = { phase:next, running:false, remaining:pomoPhaseSeconds(next), total:pomoPhaseSeconds(next), endTime:null, workDone:pomoState.workDone||0, project: next==='work' ? (app.pomodoro.currentProject||'') : (pomoState.project||'') };
  app.pomodoro.active = null;
  persist();
  renderPomodoro();
  if (app.pomodoro.settings.autoStart) startOrResumePomodoro();
}

function recordPomodoro() {
  app.pomodoro.records.push({date: today(), ts: Date.now(), project: (pomoState && pomoState.project) || app.pomodoro.currentProject || '未分类'});
  pomoFeedFlash = Date.now();
  const newly = checkPomoAchievements();
  const meals = pomoToday();
  if (meals < 4) toast(`🍅 完成 1 个番茄！🐶 ${dogName()} 吃到第 ${meals} 顿，还差 ${4-meals} 顿喂饱`);
  else if (meals === 4) toast(`🥣 ${dogName()} 今天吃饱啦！太棒了！`);
  else toast(`🍅 完成 1 个番茄！今日第 ${meals} 个，超额投喂中~`);
  newly.forEach(a=>setTimeout(()=>toast(`🏅 解锁成就：${a.icon} ${a.name}`), 350));
}

function checkPomoAchievements() {
  const unlocked = app.pomodoro.achievements;
  const newly = [];
  POMO_ACHIEVEMENTS.forEach(a=>{
    if (!unlocked.includes(a.id) && a.cond()) { unlocked.push(a.id); newly.push(a); }
  });
  return newly;
}

function restorePomodoro() {
  const a = app.pomodoro.active;
  if (!a) { pomoState = null; return; }
  if (a.running && a.endTime) {
    const rem = (a.endTime - Date.now())/1000;
    if (rem <= 0) {
      pomoState = {...a, running:false, remaining:0, endTime:null};
      app.pomodoro.active = null; persist();
    } else {
      pomoState = {...a, remaining:rem, endTime: Date.now()+rem*1000};
      beginPomoInterval();
      if (app.pomodoro.settings.sound && PomoAudio.ctx && PomoAudio.ctx.state === 'running') PomoAudio.play(pomoState.phase==='work'?'work':'rest');
    }
  } else {
    pomoState = {...a, running:false, endTime:null};
  }
}

// --- 本地音乐 (IndexedDB 存储音频文件) ---
const MusicDB = {
  _db: null,
  _open() {
    return new Promise((resolve, reject) => {
      if (this._db) return resolve(this._db);
      if (!window.indexedDB) return reject(new Error('IndexedDB 不可用'));
      const req = indexedDB.open('lifeManagerMusic', 1);
      req.onupgradeneeded = () => { req.result.createObjectStore('music'); };
      req.onsuccess = () => { this._db = req.result; resolve(this._db); };
      req.onerror = () => reject(req.error);
    });
  },
  async save(key, blob) {
    const db = await this._open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('music', 'readwrite');
      tx.objectStore('music').put(blob, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },
  async get(key) {
    const db = await this._open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('music', 'readonly');
      const req = tx.objectStore('music').get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  },
  async remove(key) {
    const db = await this._open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('music', 'readwrite');
      tx.objectStore('music').delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
};

function currentPomoAudioMode() {

function uploadMusic(mode) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'audio/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      await MusicDB.save(mode, file);
    } catch(err) {
      toast('⚠️ 保存失败：浏览器不支持或存储空间不足');
      return;
    }
    app.pomodoro.settings[mode === 'work' ? 'workMusic' : 'restMusic'] = {name: file.name, size: file.size};
    PomoAudio._blobs[mode] = file;
    persist();
    toast('🎵 已设置' + (mode === 'work' ? '工作' : '休息') + '音乐：' + file.name);
    if (pomoState && pomoState.running && currentPomoAudioMode() === mode) PomoAudio.play(mode);
    renderPomodoro();
  };
  input.click();
}

async function removeMusic(mode) {
  try { await MusicDB.remove(mode); } catch(e) {}
  if (mode === 'work') app.pomodoro.settings.workMusic = null;
  else app.pomodoro.settings.restMusic = null;
  PomoAudio._blobs[mode] = null;
  persist();
  toast('🎵 已恢复内置' + (mode === 'work' ? '专注' : '放松') + '音效');
  if (pomoState && pomoState.running && currentPomoAudioMode() === mode) PomoAudio.play(mode);
  renderPomodoro();
}

function renderPomodoro() {
  const el = document.getElementById('mod-pomodoro');
  if (!el) return;
  ensurePomodoroData();
  const s = app.pomodoro.settings;
  const phase = pomoState ? pomoState.phase : 'work';
  const running = pomoState && pomoState.running;
  const remaining = pomoState ? Math.ceil(pomoState.remaining) : pomoPhaseSeconds(phase);
  const total = pomoState ? pomoState.total : pomoPhaseSeconds(phase);
  const pct = total>0 ? Math.round(remaining/total*100) : 0;
  const ringColor = phase==='work' ? 'var(--brand-purple)' : 'var(--green)';
  const C = 2*Math.PI*72;
  const offset = (C - (remaining/total)*C).toFixed(2);
  const meals = pomoToday();
  const fed = meals >= 4;
  const dogState = meals>=4 ? 'happy' : (meals>0 ? 'ok' : 'hungry');
  const exp = dogExpInfo();

  destroyChart('pomoWeek');

  const c = getChartColors();
  const days = getWeekDays();
  const counts = pomoWeekCounts();
  const labels = days.map(d=>{ const dt=new Date(d+'T00:00:00'); return ['日','一','二','三','四','五','六'][dt.getDay()]; });
  charts.pomoWeek = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets:[{ label:'番茄数', data:counts, backgroundColor: counts.map(n=>n>=4?c.purple:c.cyan), borderRadius:8 }] },

  });
}

// ==================== POMODORO AUDIO (Web Audio 合成) ====================
const PomoAudio = {
  ctx: null, master: null, noiseSrc: null, padOscs: [], padGain: null, lfo: null, lfoGain: null,
  restTimer: null, restStep: 0, current: null, volume: 0.7, muted: false, htmlAudio: null, audioURL: null, _blobs: {}, _preview: null,

  init() {
    this.volume = app.pomodoro.settings.volume || 0.7;
    this.muted = !app.pomodoro.settings.sound;
  },
  _ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.volume;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
    return this.ctx;
  },
  setVolume(v) { this.volume = v; if (this.master) this.master.gain.value = v; if (this.htmlAudio) this.htmlAudio.volume = v; },
  setMuted(m) { this.muted = m; if (m) this.stop(); },

  async play(mode) {
    if (this.muted || !app.pomodoro.settings.sound) return;
    this.stop();
    this.current = mode;
    const key = mode === 'work' ? 'work' : 'rest';
    let blob = this._blobs[key];
    if (!blob) {
      try { blob = await MusicDB.get(key); this._blobs[key] = blob || null; } catch(e) {}
    }
    if (blob) { this._playBlob(blob); return; }
    const ctx = this._ensure();
    if (!ctx) return;
    if (mode === 'work') this._startWork(ctx);
    else this._startRest(ctx);
  },
  async preloadMusic() {
    for (const key of ['work', 'rest']) {
      try { if (this._blobs[key] === undefined) this._blobs[key] = await MusicDB.get(key) || null; } catch(e) { this._blobs[key] = null; }
    }
  },
  _playBlob(blob) {
    const url = URL.createObjectURL(blob);
    const a = new Audio();
    a.preload = 'auto';
    a.loop = true;
    a.volume = this.volume;
    a.src = url;
    a.play().catch(err => {
      console.warn('本地音乐播放失败:', err);
      toast('⚠️ 音乐播放失败：文件格式可能不受支持');
    });
    this.htmlAudio = a;
    this.audioURL = url;
  },
  async preview(mode) {
    if (this._preview) {
      try { this._preview.pause(); this._preview.src = ''; } catch(e) {}
      this._preview = null;
      toast('⏹ 已停止试听');
      return;
    }
    const key = mode === 'work' ? 'work' : 'rest';
    let blob = this._blobs[key];
    if (!blob) { try { blob = await MusicDB.get(key); this._blobs[key] = blob || null; } catch(e) {} }
    if (!blob) { toast('⚠️ 请先上传音乐文件'); return; }
    const url = URL.createObjectURL(blob);
    const a = new Audio(url);
    a.volume = this.volume;
    a.onended = () => { this._preview = null; };
    a.play()
      .then(() => toast('🔊 正在试听' + (mode === 'work' ? '工作' : '休息') + '音乐…'))
      .catch(() => { toast('⚠️ 试听失败：文件格式可能不支持'); this._preview = null; });
    this._preview = a;
  },
  _startWork(ctx) {
    const buf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i=0;i<data.length;i++){ const w = Math.random()*2-1; last = (last + 0.02*w)/1.02; data[i] = last*3.5; }
    const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const nFilter = ctx.createBiquadFilter(); nFilter.type = 'lowpass'; nFilter.frequency.value = 420;
    const nGain = ctx.createGain(); nGain.gain.value = 0.14;
    noise.connect(nFilter); nFilter.connect(nGain); nGain.connect(this.master);
    noise.start();
    this.noiseSrc = noise;

    this.padGain = ctx.createGain();
    this.padGain.gain.value = 0.05;
    this.padGain.connect(this.master);
    this.padOscs = [110, 164.81, 220].map(f => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      o.connect(this.padGain); o.start();
      return o;
    });
    this.lfo = ctx.createOscillator(); this.lfo.frequency.value = 0.08;
    this.lfoGain = ctx.createGain(); this.lfoGain.gain.value = 0.03;
    this.lfo.connect(this.lfoGain); this.lfoGain.connect(this.padGain.gain);
    this.lfo.start();
  },
  _startRest(ctx) {
    const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
    const pattern = [0,2,4,5,4,2,1,3];
    this.restStep = 0;
    const note = () => {
      const f = scale[pattern[this.restStep % pattern.length]];
      this._pluck(ctx, f);
      this.restStep++;
    };
    note();
    this.restTimer = setInterval(note, 460);
  },
  _pluck(ctx, freq) {
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
    const g = ctx.createGain();
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.75);
  },
  bell(freq, when, dur, gainVal) {
    const ctx = this.ctx;
    const partials = [1, 2.0, 2.98, 4.17, 5.43];
    const amps = [1, 0.55, 0.36, 0.2, 0.12];
    partials.forEach((ratio, i) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = freq * ratio;
      const g = ctx.createGain();
      const t = when;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gainVal * amps[i], t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.3, dur - i * 0.1));
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.1);
    });
  },
  chime(kind) {
    if (this.muted || !app.pomodoro.settings.sound) return;
    const ctx = this._ensure();
    if (!ctx) return;
    if (navigator.vibrate) { try { navigator.vibrate(kind === 'work' ? [300, 120, 300, 120, 300] : [250, 120, 250]); } catch(e) {} }
    const t0 = ctx.currentTime;
    const seq = kind === 'work' ? [659.25, 783.99, 1046.50] : [880.00, 659.25, 523.25];
    seq.forEach((f, i) => this.bell(f, t0 + i * 0.3, 1.8, 0.5));
  },
  stop() {
    if (this.noiseSrc) { try{this.noiseSrc.stop();}catch(e){} this.noiseSrc = null; }
    (this.padOscs||[]).forEach(o=>{ try{o.stop();}catch(e){} }); this.padOscs = [];
    if (this.lfo) { try{this.lfo.stop();}catch(e){} this.lfo = null; }
    if (this.restTimer) { clearInterval(this.restTimer); this.restTimer = null; }
    if (this.htmlAudio) { try { this.htmlAudio.pause(); this.htmlAudio.src = ''; } catch(e){} this.htmlAudio = null; }
    if (this.audioURL) { try { URL.revokeObjectURL(this.audioURL); } catch(e){} this.audioURL = null; }
    this.current = null;
  }
};

function renderModule(id) {
  switch(id) {
    case 'plan': renderPlan(); break;
    case 'diet': renderDiet(); break;
    case 'exercise': renderExercise(); break;
    case 'finance': renderFinance(); break;
    case 'reading': renderReading(); break;
    case 'mood': renderMood(); break;
    case 'english': renderEnglish(); break;
    case 'accounting': renderAccounting(); break;
    case 'workmemo': renderWorkMemo(); break;
    case 'photo': renderPhoto(); break;
    case 'pomodoro': renderPomodoro(); break;
    case 'theme': renderTheme(); break;
  }
}

function init() {
  if (app.theme) {
    document.documentElement.setAttribute('data-theme', app.theme);
  }
  const themeLabel = document.getElementById('themeLabel');
  const currentTheme = document.documentElement.getAttribute('data-theme');
  if (themeLabel) themeLabel.textContent = currentTheme==='dark'?'亮色模式':'暗色模式';
  const toggle = document.getElementById('themeToggle');
  if (toggle) toggle.querySelector('span').textContent = currentTheme==='dark'?'☀️':'🌙';

  buildSidebar();
  buildMainContent();
  ensurePomodoroData();
  PomoAudio.init();
  PomoAudio.preload();
  restorePomodoro();
  switchModule('plan');

  // Set active nav item
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.module==='plan'));
}

document.addEventListener('DOMContentLoaded', function() {
  init();

  // Close sidebar when clicking main content on mobile
  document.getElementById('mainContent').addEventListener('click', function(e) {
    if (window.innerWidth <= 768) closeSidebar();
  });

  // Handle keyboard shortcut for closing modal
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      const lb = document.getElementById('lightboxOverlay');
      if (lb && lb.classList.contains('open')) { closeLightbox(); return; }
      document.getElementById('weeklyModalOverlay').classList.remove('open');
      document.getElementById('aiPopup').classList.remove('open');
    }
  });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(function(reg) {
    console.log('SW registered');
  }).catch(function(err) {
    console.log('SW failed:', err);
  });
}
</script>
